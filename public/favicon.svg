<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b" />
      <stop offset="50%" stop-color="#18152e" />
      <stop offset="100%" stop-color="#090712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#272738" stroke-width="8" />
  
  <!-- Subtle Outer Ring Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.6" />

  <!-- Core Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Main Stylized Rocket / Arrow Base -->
    <path fill="url(#accentGrad)" d="M256 72 C275 140 310 185 380 200 C310 215 275 260 256 328 C237 260 202 215 132 200 C202 185 237 140 256 72 Z" />
    
    <!-- AI Spark Satellite Top Right -->
    <path fill="#f43f5e" d="M380 100 C388 124 404 140 428 148 C404 156 388 172 380 196 C372 172 356 156 332 148 C356 140 372 124 380 100 Z" opacity="0.95" />

    <!-- AI Spark Satellite Bottom Left -->
    <path fill="#38bdf8" d="M140 330 C146 348 158 360 176 366 C158 372 146 384 140 402 C134 384 122 372 104 366 C122 360 134 348 140 330 Z" opacity="0.85" />
  </g>
  
  <!-- Sleek Base Platform Bar -->
  <rect x="140" y="380" width="232" height="24" rx="12" fill="url(#accentGrad)" opacity="0.9" />
</svg>